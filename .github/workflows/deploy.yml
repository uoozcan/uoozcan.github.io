name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC: refresh publications from ORCID
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh publications (keeps the committed list if ORCID is unreachable)
        run: python scripts/sync_publications.py || echo "ORCID sync failed; using committed content/publications.json"
      - name: Build
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
